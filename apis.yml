name: CareClinic
description: 'CareClinic MCP is a private OAuth-connected health-tracking service for supported AI assistants: user-authorized
  schedule and wellness reads, observational summaries, and explicitly confirmed symptom or mood writes. Medication
  writes remain disabled. MCP-only surface -- there is no public REST contract, by design.'
